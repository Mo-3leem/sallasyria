# Post-MVP verification: typechecks, frontend build, backend tests, secret
# scan on every push/PR. No production secrets, no external services
# (all tests run against local D1/workerd), no deployment.
name: verify

on:
  push:
    branches: [main, phase/post-mvp-hardening]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Verify (backend tsc + frontend typecheck)
        run: npm run check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Frontend production build
        run: npm run build --prefix frontend

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install backend dependencies
        run: npm ci
      # Fresh checkouts have no local D1 state: `wrangler d1 execute --local`
      # auto-creates an EMPTY database, so every integration suite fails in
      # assertCleanVerify with "no such table". Apply migrations first (local
      # only, idempotent, no secrets, no remote writes).
      - name: Apply migrations to local test database
        run: npm run db:migrate:local
      - name: Backend test suite (local D1/workerd, no secrets)
        run: npm test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Frontend unit test suite (pure logic, no DOM)
        run: npm test --prefix frontend

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install Playwright Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      # E2E frontend build: the guest-checkout submit gate needs the opt-in
      # Turnstile flag baked in (documented in frontend/.env.example). The
      # stock `build` job above intentionally stays flag-free.
      - name: Frontend E2E production build
        run: NEXT_PUBLIC_E2E_ALLOW_MISSING_TURNSTILE=1 npm run build --prefix frontend
      # The E2E lifecycle (e2e/helpers.mjs) owns local D1 migration, backend
      # :8787 + frontend :3000 startup, fixture seeding, and teardown —
      # nothing is started manually here. No secrets: backend Turnstile uses
      # its existing local development behavior.
      - name: Playwright E2E suite (Chromium, local D1/workerd, no secrets)
        run: npm run test:e2e
      - name: Upload Playwright report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  secrets:
    runs-on: ubuntu-latest
    # Least privilege: only this job needs repo/PR read access (Gitleaks v3
    # lists PR commits via the API). Other jobs keep the default token scope.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Picks up .gitleaks.toml at the repo root; fails on any leak outside
      # the documented test-fixture/build-output allowlists. v3 requires the
      # automatic GITHUB_TOKEN for pull-request scans (no PAT, no custom
      # secret: secrets.GITHUB_TOKEN is provided by Actions itself).
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
